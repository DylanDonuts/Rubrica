# Database effimero separato dai dati della rubrica.
name: rubrica-api-tests
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rubrica_test
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_DB: rubrica_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubrica_test -d rubrica_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  api:
    build: ../backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: rubrica_test
      DB_PASSWORD: test_only_password
      DB_NAME: rubrica_test
    ports:
      - "127.0.0.1::3000"
    depends_on:
      postgres:
        condition: service_healthy
